<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mitt kort</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap');

  :root{
    --terracotta:#c96a4d;
    --teal:#3f9aa8;
    --ink:#161514;
    --paper:#ffffff;
    --stone:#8a8580;
    --mist:#f4f2ee;
    --heart:#e8935e;
    --home:#b18fd6;
    --ticket:#7bc7d1;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html,body{
    margin:0;
    height:100%;
    background:#000;
    font-family:'Manrope',sans-serif;
    overflow:hidden;
  }

  .phone{
    position:relative;
    width:100%;
    max-width:430px;
    height:100dvh;
    margin:0 auto;
    background:#0d0d0d;
    display:flex;
    flex-direction:column;
    color:#fff;
  }

  .statusbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 24px 6px;
    font-size:15px;
    font-weight:600;
    flex-shrink:0;
  }
  .statusbar .icons{display:flex;align-items:center;gap:6px;}
  .statusbar svg{display:block;}

  .close-btn{
    background:none;
    border:none;
    color:#e9e9e9;
    font-size:15px;
    font-weight:500;
    font-family:'Manrope',sans-serif;
    cursor:pointer;
    padding:0;
    line-height:1;
  }
  .dots{
    display:flex;
    gap:8px;
    transform:translateX(10px);
  }
  .dot{
    width:22px;
    height:22px;
    border-radius:50%;
    background:#000;
    color:#fff;
    border:none;
    font-size:12px;
    font-weight:700;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0;
    transition:background .25s, color .25s;
  }
  .dot span{display:block;transform:translateY(0.5px);}
  .dot.active{background:#fff;color:#0a0a0a;}

  .stage{
    position:relative;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6px 16px;
    perspective:1600px;
    min-height:0;
  }

  .card-wrap{
    position:relative;
    width:100%;
    max-width:360px;
    aspect-ratio:0.62/1;
    max-height:100%;
    margin:auto;
  }

  .card{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
    transition:filter .20s ease;
    cursor:pointer;
    /* Rotationen styrs nu av en JS-keyframe-animation (Web Animations
       API) istället för en enkel CSS-transition, eftersom vändningen
       ska "sjunka" (skalas ner något) mitt i rörelsen och sen växa
       tillbaka — det går inte att uttrycka med en vanlig transition
       som bara interpolerar rakt mellan start och slut. */
  }
  .card.flipped{transform:rotateY(180deg);}
  /* Kort "svisch"-oskärpa som toppar mitt i vändningen (~halva
     animationstiden) för att ge en snabbare, mer fysisk känsla —
     rensas automatiskt efter att rotationen är klar. */

  /* Skugga under kortet som förstärks/mörknar under vändningen för
     att ge ett djupare, mer 3D-känsla — matchar samma längd (.3s)
     som kortets flip-transition. Ligger utanför .card (som roterar i
     3D-rummet) så att skuggan själv hela tiden stannar platt/flack. */
  .card-shadow{
    position:absolute;
    left:50%;
    bottom:-14px;
    width:78%;
    height:22px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at center, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 72%);

    opacity:.55;
    transition:opacity .3s ease, filter .3s ease, transform .3s ease;
    pointer-events:none;
    z-index:-1;
  }
  .card-shadow.flip-active{
    opacity:.85;
 
    transform:translateX(-50%) scaleX(.72);
  }

  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:20px;
    overflow:hidden;
    background:var(--paper);
    box-shadow:0 20px 45px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.04) inset;
  }
  .face.back{transform:rotateY(180deg);}

  /* ===================== FRONT — bild täcker HELA kortet ===================== */
  /* BUGGFIX: tidigare hade .front-photo "height:58%" vilket bara täckte
     nedre delen av kortet. Nu används inset:0 så bilden fyller hela ytan. */
  .front-photo{
    position:absolute;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:var(--mist);
  }
  .front-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  /* ===================== BACK — bild täcker HELA kortet ===================== */
  .back-photo{
    position:absolute;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:var(--mist);
  }
  .back-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  /* ---- footer controls ---- */
  .modal-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 24px calc(env(safe-area-inset-bottom,0px) + 18px);
    flex-shrink:0;
  }
  .modal-footer > *{
    display:flex;
    align-items:center;
  }
  .footer-icons{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .icon-btn{
    width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    color:#eaeaea;
    background:none;
    border:none;
    cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn svg{width:100%;height:100%;}

  /*
  =====================================================================
  BORTTAGET (kommenterat, inte raderat, så du ser exakt vad som togs bort):

  Dessa CSS-klasser hörde till element som fick kortet att likna ett
  riktigt VERIFIERAT ID/medlemskort (vattenstämpel "STUK" över hela
  ytan, en vit "Verified by STUK"-bricka, en NFC-symbol + giltighets-
  ring, samt en QR-kod-knapp i foten). Jag hjälper inte till att bygga
  fungerande efterlikningar av verifieringssystem, så dessa har
  plockats bort ur den funktionella koden. De ligger kvar här som text
  om du vill se exakt hur de var uppbyggda:

  .wm{ position:absolute; inset:0; pointer-events:none; overflow:hidden; opacity:.05; z-index:0; }
  .wm span{ position:absolute; font-weight:800; font-size:13px; letter-spacing:1px; color:#000; white-space:nowrap; }

  .verified{
    position:absolute; left:12px; bottom:14px; z-index:2;
    background:#fff; border-radius:20px; padding:5px 10px 5px 8px;
    display:flex; align-items:center; gap:5px; font-size:8px; font-weight:800;
    letter-spacing:.4px; color:#111; box-shadow:0 3px 8px rgba(0,0,0,.25);
    text-transform:uppercase; line-height:1.05;
  }
  .verified b{ display:block; font-size:11px; letter-spacing:.5px; }
  .verified .vtxt{ opacity:.65; font-size:6.5px; letter-spacing:.6px; }

  .sl-insert{
    position:absolute; right:12px; bottom:14px; z-index:2;
    background:#fff; border-radius:8px; padding:6px 8px;
    display:flex; align-items:center; gap:6px; box-shadow:0 3px 8px rgba(0,0,0,.25);
  }
  .sl-insert .valid{
    font-size:6.3px; font-weight:700; color:#333;
    writing-mode:vertical-rl; transform:rotate(180deg); letter-spacing:.3px;
  }
  .sl-insert .ring{ width:20px; height:20px; }
  .sl-insert .nfc{ width:16px; height:16px; }

  .icon-btn.qr-btn{ width:38px; height:38px; }
  .icon-btn.qr-btn img{ width:38px; height:38px; max-width:38px; max-height:38px; }
  =====================================================================
  */

  .hint{
    text-align:center;
    font-size:11px;
    color:#6b6b6b;
    font-weight:500;
    padding-bottom:2px;
    flex-shrink:0;
    letter-spacing:.2px;
  }
</style>
</head>
<body>

<div class="phone">

  <div class="stage">
   <div class="card-wrap">
    <div class="card-shadow" id="cardShadow"></div>
    <div class="card" id="card">

      <!-- FRONT — bilden fyller hela kortet -->
      <div class="face front">
        <!-- ===== LÄGG DIN BILDFIL HÄR =====
             Byt ut "din-bild.jpg" nedan mot sökvägen/filnamnet
             till din egen bild (t.ex. "bilder/mitt-foto.jpg").
        -->
        <div class="front-photo">
          <img src="IMG_3444.jpg" alt="Kortbild">
        </div>
      </div>

      <!--
      =====================================================================
      BORTTAGET (kommenterat, inte raderat):
      Här låg tidigare byggnadsillustrationen, "Verified by STUK"-brickan
      och NFC/giltighets-inserten ovanpå bilden, plus en vattenstämpel-div
      (id="wmFront") som upprepade texten "STUK" diagonalt över hela ytan.
      De togs bort av samma anledning som CSS-reglerna ovan.

      <div class="verified">
        <div><span class="vtxt">Verified by</span><b>STUK</b></div>
      </div>
      <div class="sl-insert">
        <span class="valid">GILTIGT TILL: 2027-09-10</span>
        <svg class="ring" ...></svg>
        <svg class="nfc" ...></svg>
      </div>
      =====================================================================
      -->

      <!-- BACK — bilden fyller hela kortet -->
      <div class="face back">
        <!-- ===== LÄGG DIN BILDFIL HÄR (baksida) =====
             Byt ut "din-bild-baksida.jpg" nedan mot sökvägen/filnamnet
             till din egen bild.
        -->
        <div class="back-photo">
          <img src="IMG_3441.jpeg" alt="Kortbild baksida">
        </div>
      </div>

    </div>
   </div>
  </div>

  <div class="modal-footer">
    <button class="close-btn">Stäng</button>

    <div class="dots">
      <div class="dot active"><span>1</span></div>
      <div class="dot"><span>2</span></div>
      <div class="dot"><span>3</span></div>
    </div>

    <div class="footer-icons">
      <!--
      =====================================================================
      BORTTAGET (kommenterat, inte raderat):
      Här låg en QR-kod-knapp (base64-inbäddad JPG-bild av en QR-kod).
      Kombinerat med "Verified by"-brickan skapade den intrycket av ett
      skannbart, officiellt verifieringskort, så den är borttagen.

      <button class="icon-btn qr-btn" aria-label="QR-kod">
        <img width="38" height="38" src="data:image/jpeg;base64,..." alt="QR-kod" />
      </button>
      =====================================================================
      -->
      <button class="icon-btn" aria-label="Uppdatera" id="refreshBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4v6h6M20 20v-6h-6"/>
          <path d="M20 10a8 8 0 00-14.9-3.5M4 14a8 8 0 0014.9 3.5"/>
        </svg>
      </button>
    </div>
  </div>

</div>

<script>
  const card = document.getElementById('card');
  const cardShadow = document.getElementById('cardShadow');
  const FLIP_MS = 400;
  let isFlipped = false;
  let isAnimating = false;

  card.addEventListener('click', () => {
    if (isAnimating) return;
    isAnimating = true;

    const fromDeg = isFlipped ? 180 : 0;
    const toDeg = isFlipped ? 0 : 180;

    // Rotation + en skal-"dipp" mitt i vändningen: kortet krymper
    // lite (som att det sjunker bakåt i djupet) och växer sen
    // tillbaka till full storlek när det landar platt igen.
    const keyframes = [
      { transform: `rotateY(${fromDeg}deg) scale(1)` },
      { transform: `rotateY(${(fromDeg + toDeg) / 2}deg) scale(0.90)`, offset: 0.5 },
      { transform: `rotateY(${toDeg}deg) scale(1)` }
    ];

    card.animate(keyframes, {
      duration: FLIP_MS,
      easing: 'cubic-bezier(.4,.15,.2,1)',
      fill: 'forwards'
    });

    // Skuggan mörknar/smalnar av mitt i vändningen och återgår sen,
    // för att förstärka djupkänslan under rotationen.
    cardShadow.classList.add('flip-active');
   
    // snabbare, mer "svischig" känsla, som sen försvinner igen.
    card.classList.add('mid-flip');

    setTimeout(() => {
      cardShadow.classList.remove('flip-active');
      card.classList.remove('mid-flip');
      isFlipped = !isFlipped;
      // Låser den slutgiltiga rotationen som ett vanligt CSS-state
      // (utöver Web Animation-resultatet) så framtida vändningar
      // alltid utgår från rätt vinkel.
      card.style.transform = `rotateY(${toDeg}deg) scale(1)`;
      isAnimating = false;
    }, FLIP_MS);
  });

  const refreshBtn = document.getElementById('refreshBtn');
  refreshBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    refreshBtn.style.transform = 'rotate(360deg)';
    refreshBtn.style.transition = 'transform .5s';
    setTimeout(()=> refreshBtn.style.transform = '', 550);
  });

  

  function tileWatermark(el){
    const rows = 9, cols = 3;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const s = document.createElement('span');
        s.textContent = 'STUK';
        s.style.top = (r*70-20) + 'px';
        s.style.left = (c*130 - (r%2?30:0)) + 'px';
        s.style.transform = 'rotate(-18deg)';
        el.appendChild(s);
      }
    }
  }
  tileWatermark(document.getElementById('wmFront'));
  tileWatermark(document.getElementById('wmBack'));
  
  function setClock(){
    const d = new Date();
    document.getElementById('clock').textContent =
      d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }
  setClock();
  setInterval(setClock, 15000);
</script>

</body>
</html>
