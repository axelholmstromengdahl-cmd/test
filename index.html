<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="data:application/manifest+json,{%22display%22:%22standalone%22,%22background_color%22:%22%23121212%22,%22theme_color%22:%22%23121212%22}">
<title>Mitt kort</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap');

  :root{
    --terracotta:#c96a4d;
    --teal:#3f9aa8;
    --ink:#161514;
    --paper:#ffffff;
    --stone:#8a8580;
    --mist:#121212;
    --heart:#e8935e;
    --home:#b18fd6;
    --ticket:#7bc7d1;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html,body{
    margin:0;
    height:100%;
    background:#121212;
    font-family:'Manrope',sans-serif;
    overflow:hidden;
  }

  .phone{
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    width:100%;
    max-width:430px;
    margin:0 auto;
    background:#121212;
    display:flex;
    flex-direction:column;
    color:#fff;
    padding-top:env(safe-area-inset-top);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }

  .statusbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 24px 6px;
    font-size:15px;
    font-weight:600;
    flex-shrink:0;
  }
  .statusbar .icons{display:flex;align-items:center;gap:6px;}
  .statusbar svg{display:block;}

  .close-btn{
    background:none;
    border:none;
    color:#e9e9e9;
    font-size:15px;
    font-weight:500;
    font-family:'Manrope',sans-serif;
    cursor:pointer;
    padding:0;
    line-height:1;
    text-decoration:none;
    display:inline-block;
  }
  .dots{
    display:flex;
    gap:8px;
    transform:translateX(10px);
  }
  .dot{
    width:22px;
    height:22px;
    border-radius:50%;
    background:#000;
    color:#fff;
    border:none;
    font-size:12px;
    font-weight:700;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0;
    transition:background .25s, color .25s;
  }
  .dot span{display:block;transform:translateY(0.5px);}
  .dot.active{background:#fff;color:#0a0a0a;}

  .stage{
    position:relative;
    flex:1;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding:10px;
    perspective:1600px;
    min-height:0;
  }

  /* Vattenstämpel-lagret fyller hela den svarta scenen bakom
     korthållaren. Texterna startar i mitten och driver sedan ut åt
     slumpmässiga håll (som en DVD-logga), men istället för att
     studsa mot kanterna flyger de utanför, försvinner (despawn) och
     dyker sen upp igen utanför rutan och flyger in på nytt. Kortet
     ligger ovanpå (högre z-index) så texten syns bara i det svarta
     området runt kortet — exakt gränsen mellan grått och svart —
     och klipps bort helt utanför scenen. */
  .watermark{
    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:0;
    pointer-events:none;
  }
  .wm-item{
    position:absolute;
    top:0;
    left:0;
    width:95px;
    height:auto;
    pointer-events:none;
    will-change:transform;
  }

  .card-wrap{
    position:relative;
    width:100%;
    max-width:100%;
    aspect-ratio:0.62/1;
    max-height:100%;
    margin:0 auto;
    z-index:1;
  }

  .card{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
    transition:filter .20s ease;
    cursor:pointer;
    /* Rotationen styrs nu av en JS-keyframe-animation (Web Animations
       API) istället för en enkel CSS-transition, eftersom vändningen
       ska "sjunka" (skalas ner något) mitt i rörelsen och sen växa
       tillbaka — det går inte att uttrycka med en vanlig transition
       som bara interpolerar rakt mellan start och slut. */
  }
  .card.flipped{transform:rotateY(180deg);}

  /* Skugga under kortet som förstärks/mörknar under vändningen för
     att ge ett djupare, mer 3D-känsla — matchar samma längd (.3s)
     som kortets flip-transition. Ligger utanför .card (som roterar i
     3D-rummet) så att skuggan själv hela tiden stannar platt/flack. */
  .card-shadow{
    position:absolute;
    left:50%;
    bottom:-14px;
    width:78%;
    height:22px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at center, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 72%);

    opacity:.55;
    transition:opacity .3s ease, filter .3s ease, transform .3s ease;
    pointer-events:none;
    z-index:-1;
  }
  .card-shadow.flip-active{
    opacity:.85;
 
    transform:translateX(-50%) scaleX(.72);
  }

  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:20px;
    overflow:hidden;
    background:var(--paper);
    box-shadow:0 20px 45px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.04) inset;
  }
  .face.back{transform:rotateY(180deg);}

  .front-photo{
    position:absolute;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:var(--mist);
  }
  .front-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .back-photo{
    position:absolute;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:var(--mist);
  }
  .back-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .modal-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 5px 15px 24px;
    flex-shrink:0;
  }
  .modal-footer > *{
    display:flex;
    align-items:center;
  }
  .footer-icons{
    display:flex;
    align-items:center;
    gap:1px;
  }
  .icon-btn{
    width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    color:#eaeaea;
    background:none;
    border:none;
    cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn svg{width:100%;height:100%;}

  .icon-btn.qr-btn{width:42px;height:42px;}
  .icon-btn.qr-btn img{width:100%;height:100%;object-fit:contain;display:block;}

  .hint{
    text-align:center;
    font-size:11px;
    color:#6b6b6b;
    font-weight:500;
    padding-bottom:2px;
    flex-shrink:0;
    letter-spacing:.2px;
  }

  /* ===================== STARTSIDA / NAVIGATION ===================== */
  /* Detta är startsidan som visas innan man valt vilket kort man vill
     se. Den fyller precis samma yta som kortvyn (.phone), så bytet
     mellan sidorna sker bara genom att visa/dölja med .hidden. */
  .nav-screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  }
  .nav-inner{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:28px 24px;
    overflow-y:auto;
    min-height:0;
  }
  .nav-heading{
    font-size:26px;
    font-weight:800;
    color:#fff;
    margin:0 0 6px;
    letter-spacing:-.3px;
  }
  .nav-subheading{
    font-size:14px;
    font-weight:500;
    color:#8a8580;
    margin:0 0 26px;
  }
  .nav-list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  /* Varje knapp = ett "kort" man kan lägga till/döpa om. Rubriken
     (.nav-btn-title) är namnet man ser innan man klickar. */
  .nav-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    width:100%;
    padding:18px 20px;
    border-radius:16px;
    background:#1c1c1c;
    border:1px solid #2a2a2a;
    color:#fff;
    text-align:left;
    cursor:pointer;
    font-family:'Manrope',sans-serif;
    transition:background .15s ease, transform .15s ease;
  }
  .nav-btn:active{
    background:#262626;
    transform:scale(.98);
  }
  .nav-btn-text{
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .nav-btn-title{
    font-size:16px;
    font-weight:700;
  }
  .nav-btn-sub{
    font-size:12.5px;
    font-weight:500;
    color:#8a8580;
  }
  .nav-btn-arrow{
    flex-shrink:0;
    width:18px;
    height:18px;
    color:#6b6b6b;
  }
  .nav-btn-arrow svg{width:100%;height:100%;}

  .card-view{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
  }

  .hidden{display:none !important;}
</style>
</head>
<body>

<div class="phone">

  <!-- ============ STARTSIDA (NAVIGATION) ============
       Denna sida visas först. Knapparna genereras automatiskt av
       JS-koden längst ner (utifrån CARDS-listan), så för att lägga
       till/ändra/döpa om kort — rör INTE denna HTML. Gå istället ner
       till "===== DINA KORT HÄR =====" i <script> och redigera
       CARDS-listan där. -->
  <div class="nav-screen" id="navScreen">
    <div class="nav-inner">
      <h1 class="nav-heading">Mina kort</h1>
      <p class="nav-subheading">Välj vilket kort du vill visa</p>
      <div class="nav-list" id="navList"><!-- Knappar skapas av JS --></div>
    </div>
  </div>

  <!-- ============ KORTVYN ============
       Visas när man klickat på ett kort i navigationen. -->
  <div class="card-view hidden" id="cardView">

    <div class="stage">
     <div class="watermark" id="watermark"></div>
     <div class="card-wrap">
      <div class="card-shadow" id="cardShadow"></div>
      <div class="card" id="card">

        <!-- FRONT — bilden fyller hela kortet -->
        <div class="face front">
          <div class="front-photo">
            <img id="frontImg" src="" alt="Kortbild">
          </div>
        </div>

        <!-- BACK — bilden fyller hela kortet -->
        <div class="face back">
          <div class="back-photo">
            <img id="backImg" src="" alt="Kortbild baksida">
          </div>
        </div>

      </div>
     </div>
    </div>

    <div class="modal-footer">
      <!-- "Stäng" tar dig tillbaka till startsidan/navigationen. -->
      <button class="close-btn" id="closeBtn">Stäng</button>

      <div class="dots">
        <div class="dot active"><span>1</span></div>
        <div class="dot"><span>2</span></div>
        <div class="dot"><span>3</span></div>
      </div>

      <div class="footer-icons">
        <!-- Lägg din egen QR-kodbild här: byt src="din-qr-kod.png"
             mot sökvägen/filnamnet till din egen QR-kodbild. -->
        <button class="icon-btn qr-btn" aria-label="QR-kod">
          <img src="image/tr.png" alt="QR-kod">
        </button>
        <button class="icon-btn" aria-label="Uppdatera" id="refreshBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4v6h6M20 20v-6h-6"/>
            <path d="M20 10a8 8 0 00-14.9-3.5M4 14a8 8 0 0014.9 3.5"/>
          </svg>
        </button>
      </div>
    </div>

  </div>

</div>

<script>
  /* ===== GEMENSAM BAKSIDA =====
     Alla kort delar samma baksida — bara framsidan skiljer sig
     mellan korten. Byt sökvägen nedan mot din egen baksidesbild. */
  const SHARED_BACK = 'image/IMG_3441.jpeg';

  /* ===== DINA KORT HÄR =====
     Lägg till, ta bort eller döp om kort genom att redigera listan
     nedan. Varje kort behöver bara:
       name  – rubriken som syns på knappen i navigationen
       sub   – (valfritt) en kort undertext under rubriken, kan tas bort
       front – sökväg till bilden på framsidan
     (Baksidan sätts automatiskt till SHARED_BACK ovan för alla kort.) */
  const CARDS = [
    {
      name: 'Fabian',
      sub: 'Tryck för att visa',
      front: 'image/Ggg.jpg'
    },
    {
      name: 'David',
      sub: 'Tryck för att visa',
      front: 'image/dav.jpg'
    },
    {
      name: 'Herman',
      sub: 'Tryck för att visa',
      front: 'image/her.jpg'
    },
    {
      name: 'ali',
      sub: 'Tryck för att visa',
      front: 'image/ali.jpeg'
    },
    {
      name: 'max',
      sub: 'Tryck för att visa',
      front: 'image/max.jpeg'
    }
  ];

  const navScreen = document.getElementById('navScreen');
  const cardView = document.getElementById('cardView');
  const navList = document.getElementById('navList');
  const frontImg = document.getElementById('frontImg');
  const backImg = document.getElementById('backImg');
  const closeBtn = document.getElementById('closeBtn');

  let watermarkStarted = false;

  // Bygger en knapp per kort i CARDS-listan, med tydlig rubrik så
  // man vet vad man klickar på.
  CARDS.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn';
    btn.innerHTML = `
      <span class="nav-btn-text">
        <span class="nav-btn-title">${c.name}</span>
        <span class="nav-btn-sub">${c.sub || 'Tryck för att visa'}</span>
      </span>
      <span class="nav-btn-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </span>
    `;
    btn.addEventListener('click', () => openCard(i));
    navList.appendChild(btn);
  });

  function openCard(index){
    const c = CARDS[index];
    frontImg.src = c.front;
    backImg.src = SHARED_BACK;

    // Om kortet råkar visas uppochner/vänt från tidigare vändning,
    // återställ det till framsidan innan det nya kortet visas.
    isFlipped = false;
    card.classList.remove('flipped');
    card.style.transform = '';

    navScreen.classList.add('hidden');
    cardView.classList.remove('hidden');

    // Vattenstämpeln startas bara en gång (den ligger kvar i DOM:en
    // och animeras vidare i bakgrunden oavsett vilket kort som visas).
    if (!watermarkStarted){
      watermarkStarted = true;
      initWatermark('image/blav.png');
    }
  }

  function goBack(){
    cardView.classList.add('hidden');
    navScreen.classList.remove('hidden');
  }

  closeBtn.addEventListener('click', goBack);

  const card = document.getElementById('card');
  const cardShadow = document.getElementById('cardShadow');
  const FLIP_MS = 400;
  let isFlipped = false;
  let isAnimating = false;

  card.addEventListener('click', () => {
    if (isAnimating) return;
    isAnimating = true;

    const fromDeg = isFlipped ? 180 : 0;
    const toDeg = isFlipped ? 0 : 180;

    // Rotation + en skal-"dipp" mitt i vändningen: kortet krymper
    // lite (som att det sjunker bakåt i djupet) och växer sen
    // tillbaka till full storlek när det landar platt igen.
    const keyframes = [
      { transform: `rotateY(${fromDeg}deg) scale(1)` },
      { transform: `rotateY(${(fromDeg + toDeg) / 2}deg) scale(0.90)`, offset: 0.5 },
      { transform: `rotateY(${toDeg}deg) scale(1)` }
    ];

    card.animate(keyframes, {
      duration: FLIP_MS,
      easing: 'cubic-bezier(.4,.15,.2,1)',
      fill: 'forwards'
    });

    // Skuggan mörknar/smalnar av mitt i vändningen och återgår sen,
    // för att förstärka djupkänslan under rotationen.
    cardShadow.classList.add('flip-active');
    card.classList.add('mid-flip');

    setTimeout(() => {
      cardShadow.classList.remove('flip-active');
      card.classList.remove('mid-flip');
      isFlipped = !isFlipped;
      // Låser den slutgiltiga rotationen som ett vanligt CSS-state
      // (utöver Web Animation-resultatet) så framtida vändningar
      // alltid utgår från rätt vinkel.
      card.style.transform = `rotateY(${toDeg}deg) scale(1)`;
      isAnimating = false;
    }, FLIP_MS);
  });

  const refreshBtn = document.getElementById('refreshBtn');
  refreshBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    refreshBtn.style.transform = 'rotate(360deg)';
    refreshBtn.style.transition = 'transform .5s';
    setTimeout(()=> refreshBtn.style.transform = '', 550);
  });

  function initWatermark(src){
    const wrap = document.getElementById('watermark');
    const COUNT = 6;
    const SPEED = 22; // px per sekund
    const OUT_MARGIN = 110; // hur långt utanför rutan den flyger innan den despawnar (större än bildens storlek, så den alltid är helt osynlig innan den försvinner/dyker upp)
    const items = [];

    function rand(min, max){ return min + Math.random() * (max - min); }

    function makeEl(){
      const img = document.createElement('img');
      img.src = src;
      img.alt = '';
      img.className = 'wm-item';
      wrap.appendChild(img);
      return img;
    }

    function getSize(){
      const r = wrap.getBoundingClientRect();
      return { W: r.width, H: r.height };
    }

    // Startposition: mitten av rutan, med slumpmässig riktning utåt
    // (precis som i videon där texten börjar centrerad).
    function spawnAtCenter(item, W, H){
      const angle = rand(0, Math.PI * 2);
      item.x = W / 2;
      item.y = H / 2;
      item.vx = Math.cos(angle) * SPEED;
      item.vy = Math.sin(angle) * SPEED;
    }

    // Respawn: dyker upp utanför rutan på en slumpmässig kant och
    // flyger sedan in mot ett slumpmässigt mål inne i rutan.
    function respawnOutside(item, W, H){
      const edge = Math.floor(rand(0, 4)); // 0=topp,1=höger,2=botten,3=vänster
      const margin = OUT_MARGIN; // samma marginal som OUT_MARGIN, så den spawnar in helt osedd
      let x, y;
      if (edge === 0)      { x = rand(0, W); y = -margin; }
      else if (edge === 1) { x = W + margin; y = rand(0, H); }
      else if (edge === 2) { x = rand(0, W); y = H + margin; }
      else                 { x = -margin; y = rand(0, H); }

      const targetX = rand(W * 0.2, W * 0.8);
      const targetY = rand(H * 0.2, H * 0.8);
      const dx = targetX - x;
      const dy = targetY - y;
      const len = Math.hypot(dx, dy) || 1;

      item.x = x;
      item.y = y;
      item.vx = (dx / len) * SPEED;
      item.vy = (dy / len) * SPEED;
    }

    let { W, H } = getSize();

    for (let i = 0; i < COUNT; i++){
      const el = makeEl();
      const item = { el, x: 0, y: 0, vx: 0, vy: 0 };
      spawnAtCenter(item, W, H);
      items.push(item);
    }

    let last = performance.now();

    function tick(now){
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      ({ W, H } = getSize());

      // Scenen har ingen storlek när kortvyn är dold (man är på
      // startsidan) — då ska inget flyttas den här rutan, annars
      // drar allt ihop sig mot 0,0 och fastnar i ett hörn tills man
      // öppnar ett kort igen.
      if (W > 0 && H > 0){
        for (const item of items){
          item.x += item.vx * dt;
          item.y += item.vy * dt;

          if (item.x < -OUT_MARGIN || item.x > W + OUT_MARGIN ||
              item.y < -OUT_MARGIN || item.y > H + OUT_MARGIN){
            respawnOutside(item, W, H);
          }
        }

        // Håller lite avstånd mellan bilderna så de inte glider ihop
        // och överlappar varandra när banorna korsas.
        const MIN_DIST = 70;
        for (let i = 0; i < items.length; i++){
          for (let j = i + 1; j < items.length; j++){
            const a = items[i], b = items[j];
            const dx = b.x - a.x, dy = b.y - a.y;
            const dist = Math.hypot(dx, dy) || 0.001;
            if (dist < MIN_DIST){
              const push = (MIN_DIST - dist) / MIN_DIST * 6;
              const nx = dx / dist, ny = dy / dist;
              a.x -= nx * push;
              a.y -= ny * push;
              b.x += nx * push;
              b.y += ny * push;
            }
          }
        }

        for (const item of items){
          item.el.style.transform = `translate(${item.x}px, ${item.y}px)`;
        }
      }

      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  // OBS: initWatermark(...) anropas inte längre här — den startas
  // automatiskt första gången ett kort öppnas (se openCard ovan).
  // Vill du byta vattenstämpel-bild, ändra sökvägen i openCard-
  // funktionen ("image/blav.png").
</script>

</body>
</html>
