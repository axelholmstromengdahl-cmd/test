<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="data:application/manifest+json,{%22display%22:%22standalone%22,%22background_color%22:%22%23121212%22,%22theme_color%22:%22%23121212%22}">
<title>Mitt kort</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap');

  :root{
    --terracotta:#c96a4d;
    --teal:#3f9aa8;
    --ink:#161514;
    --paper:#ffffff;
    --stone:#8a8580;
    --mist:#121212;
    --heart:#e8935e;
    --home:#b18fd6;
    --ticket:#7bc7d1;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html,body{
    margin:0;
    height:100%;
    background:#000;
    font-family:'Manrope',sans-serif;
    overflow:hidden;
  }

  .phone{
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    width:100%;
    max-width:430px;
    margin:0 auto;
    background:#121212;
    display:flex;
    flex-direction:column;
    color:#fff;
    padding-top:env(safe-area-inset-top);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
    padding-bottom:env(safe-area-inset-bottom);
  }

  .statusbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 24px 6px;
    font-size:15px;
    font-weight:600;
    flex-shrink:0;
  }
  .statusbar .icons{display:flex;align-items:center;gap:6px;}
  .statusbar svg{display:block;}

  .close-btn{
    background:none;
    border:none;
    color:#e9e9e9;
    font-size:15px;
    font-weight:500;
    font-family:'Manrope',sans-serif;
    cursor:pointer;
    padding:0;
    line-height:1;
  }
  .dots{
    display:flex;
    gap:8px;
    transform:translateX(10px);
  }
  .dot{
    width:22px;
    height:22px;
    border-radius:50%;
    background:#000;
    color:#fff;
    border:none;
    font-size:12px;
    font-weight:700;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0;
    transition:background .25s, color .25s;
  }
  .dot span{display:block;transform:translateY(0.5px);}
  .dot.active{background:#fff;color:#0a0a0a;}

  .stage{
    position:relative;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
    perspective:1600px;
    min-height:0;
  }

  /* Vattenstämpel-lagret fyller hela den svarta scenen bakom
     korthållaren. Texterna startar i mitten och driver sedan ut åt
     slumpmässiga håll (som en DVD-logga), men istället för att
     studsa mot kanterna flyger de utanför, försvinner (despawn) och
     dyker sen upp igen utanför rutan och flyger in på nytt. Kortet
     ligger ovanpå (högre z-index) så texten syns bara i det svarta
     området runt kortet — exakt gränsen mellan grått och svart —
     och klipps bort helt utanför scenen. */
  .watermark{
    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:0;
    pointer-events:none;
  }
  .wm-item{
    position:absolute;
    top:0;
    left:0;
    width:95px;
    height:auto;
    pointer-events:none;
    will-change:transform;
  }

  .card-wrap{
    position:relative;
    width:100%;
    max-width:100%;
    aspect-ratio:0.62/1;
    max-height:100%;
    margin:auto;
    z-index:1;
  }

  .card{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
    transition:filter .20s ease;
    cursor:pointer;
    /* Rotationen styrs nu av en JS-keyframe-animation (Web Animations
       API) istället för en enkel CSS-transition, eftersom vändningen
       ska "sjunka" (skalas ner något) mitt i rörelsen och sen växa
       tillbaka — det går inte att uttrycka med en vanlig transition
       som bara interpolerar rakt mellan start och slut. */
  }
  .card.flipped{transform:rotateY(180deg);}

  /* Skugga under kortet som förstärks/mörknar under vändningen för
     att ge ett djupare, mer 3D-känsla — matchar samma längd (.3s)
     som kortets flip-transition. Ligger utanför .card (som roterar i
     3D-rummet) så att skuggan själv hela tiden stannar platt/flack. */
  .card-shadow{
    position:absolute;
    left:50%;
    bottom:-14px;
    width:78%;
    height:22px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at center, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 72%);

    opacity:.55;
    transition:opacity .3s ease, filter .3s ease, transform .3s ease;
    pointer-events:none;
    z-index:-1;
  }
  .card-shadow.flip-active{
    opacity:.85;
 
    transform:translateX(-50%) scaleX(.72);
  }

  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:20px;
    overflow:hidden;
    background:var(--paper);
    box-shadow:0 20px 45px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.04) inset;
  }
  .face.back{transform:rotateY(180deg);}

  .front-photo{
    position:absolute;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:var(--mist);
  }
  .front-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .back-photo{
    position:absolute;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:var(--mist);
  }
  .back-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .modal-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 5px calc(env(safe-area-inset-bottom,0px) + 18px) 24px;
    flex-shrink:0;
  }
  .modal-footer > *{
    display:flex;
    align-items:center;
  }
  .footer-icons{
    display:flex;
    align-items:center;
    gap:1px;
  }
  .icon-btn{
    width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    color:#eaeaea;
    background:none;
    border:none;
    cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn svg{width:100%;height:100%;}

  .icon-btn.qr-btn{width:42px;height:42px;}
  .icon-btn.qr-btn img{width:100%;height:100%;object-fit:contain;display:block;}

  .hint{
    text-align:center;
    font-size:11px;
    color:#6b6b6b;
    font-weight:500;
    padding-bottom:2px;
    flex-shrink:0;
    letter-spacing:.2px;
  }
</style>
</head>
<body>

<div class="phone">

  <div class="stage">
   <div class="watermark" id="watermark"></div>
   <div class="card-wrap">
    <div class="card-shadow" id="cardShadow"></div>
    <div class="card" id="card">

      <!-- FRONT — bilden fyller hela kortet -->
      <div class="face front">
        <!-- ===== LÄGG DIN BILDFIL HÄR =====
             Byt ut "din-bild.jpg" nedan mot sökvägen/filnamnet
             till din egen bild (t.ex. "bilder/mitt-foto.jpg").
        -->
        <div class="front-photo">
          <img src="image/IMG_3444.jpg" alt="Kortbild">
        </div>
      </div>

      <!-- BACK — bilden fyller hela kortet -->
      <div class="face back">
        <!-- ===== LÄGG DIN BILDFIL HÄR (baksida) =====
             Byt ut "din-bild-baksida.jpg" nedan mot sökvägen/filnamnet
             till din egen bild.
        -->
        <div class="back-photo">
          <img src="image/IMG_3441.jpeg" alt="Kortbild baksida">
        </div>
      </div>

    </div>
   </div>
  </div>

  <div class="modal-footer">
    <button class="close-btn">Stäng</button>

    <div class="dots">
      <div class="dot active"><span>1</span></div>
      <div class="dot"><span>2</span></div>
      <div class="dot"><span>3</span></div>
    </div>

    <div class="footer-icons">
      <!-- Lägg din egen QR-kodbild här: byt src="din-qr-kod.png"
           mot sökvägen/filnamnet till din egen QR-kodbild. -->
      <button class="icon-btn qr-btn" aria-label="QR-kod">
        <img src="image/tr.png" alt="QR-kod">
      </button>
      <button class="icon-btn" aria-label="Uppdatera" id="refreshBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4v6h6M20 20v-6h-6"/>
          <path d="M20 10a8 8 0 00-14.9-3.5M4 14a8 8 0 0014.9 3.5"/>
        </svg>
      </button>
    </div>
  </div>

</div>

<script>
  const card = document.getElementById('card');
  const cardShadow = document.getElementById('cardShadow');
  const FLIP_MS = 400;
  let isFlipped = false;
  let isAnimating = false;

  card.addEventListener('click', () => {
    if (isAnimating) return;
    isAnimating = true;

    const fromDeg = isFlipped ? 180 : 0;
    const toDeg = isFlipped ? 0 : 180;

    // Rotation + en skal-"dipp" mitt i vändningen: kortet krymper
    // lite (som att det sjunker bakåt i djupet) och växer sen
    // tillbaka till full storlek när det landar platt igen.
    const keyframes = [
      { transform: `rotateY(${fromDeg}deg) scale(1)` },
      { transform: `rotateY(${(fromDeg + toDeg) / 2}deg) scale(0.90)`, offset: 0.5 },
      { transform: `rotateY(${toDeg}deg) scale(1)` }
    ];

    card.animate(keyframes, {
      duration: FLIP_MS,
      easing: 'cubic-bezier(.4,.15,.2,1)',
      fill: 'forwards'
    });

    // Skuggan mörknar/smalnar av mitt i vändningen och återgår sen,
    // för att förstärka djupkänslan under rotationen.
    cardShadow.classList.add('flip-active');
    card.classList.add('mid-flip');

    setTimeout(() => {
      cardShadow.classList.remove('flip-active');
      card.classList.remove('mid-flip');
      isFlipped = !isFlipped;
      // Låser den slutgiltiga rotationen som ett vanligt CSS-state
      // (utöver Web Animation-resultatet) så framtida vändningar
      // alltid utgår från rätt vinkel.
      card.style.transform = `rotateY(${toDeg}deg) scale(1)`;
      isAnimating = false;
    }, FLIP_MS);
  });

  const refreshBtn = document.getElementById('refreshBtn');
  refreshBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    refreshBtn.style.transform = 'rotate(360deg)';
    refreshBtn.style.transition = 'transform .5s';
    setTimeout(()=> refreshBtn.style.transform = '', 550);
  });

  function initWatermark(src){
    const wrap = document.getElementById('watermark');
    const COUNT = 6;
    const SPEED = 22; // px per sekund
    const OUT_MARGIN = 160; // hur långt utanför rutan den flyger innan den despawnar (större än bildens storlek, så den alltid är helt osynlig innan den försvinner/dyker upp)
    const items = [];

    function rand(min, max){ return min + Math.random() * (max - min); }

    function makeEl(){
      const img = document.createElement('img');
      img.src = src;
      img.alt = '';
      img.className = 'wm-item';
      wrap.appendChild(img);
      return img;
    }

    function getSize(){
      const r = wrap.getBoundingClientRect();
      return { W: r.width, H: r.height };
    }

    // Startposition: mitten av rutan, med slumpmässig riktning utåt
    // (precis som i videon där texten börjar centrerad).
    function spawnAtCenter(item, W, H){
      const angle = rand(0, Math.PI * 2);
      item.x = W / 2;
      item.y = H / 2;
      item.vx = Math.cos(angle) * SPEED;
      item.vy = Math.sin(angle) * SPEED;
    }

    // Respawn: dyker upp utanför rutan på en slumpmässig kant och
    // flyger sedan in mot ett slumpmässigt mål inne i rutan.
    function respawnOutside(item, W, H){
      const edge = Math.floor(rand(0, 4)); // 0=topp,1=höger,2=botten,3=vänster
      const margin = 160; // samma marginal som OUT_MARGIN, så den spawnar in helt osedd
      let x, y;
      if (edge === 0)      { x = rand(0, W); y = -margin; }
      else if (edge === 1) { x = W + margin; y = rand(0, H); }
      else if (edge === 2) { x = rand(0, W); y = H + margin; }
      else                 { x = -margin; y = rand(0, H); }

      const targetX = rand(W * 0.2, W * 0.8);
      const targetY = rand(H * 0.2, H * 0.8);
      const dx = targetX - x;
      const dy = targetY - y;
      const len = Math.hypot(dx, dy) || 1;

      item.x = x;
      item.y = y;
      item.vx = (dx / len) * SPEED;
      item.vy = (dy / len) * SPEED;
    }

    let { W, H } = getSize();

    for (let i = 0; i < COUNT; i++){
      const el = makeEl();
      const item = { el, x: 0, y: 0, vx: 0, vy: 0 };
      spawnAtCenter(item, W, H);
      items.push(item);
    }

    let last = performance.now();

    function tick(now){
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      ({ W, H } = getSize());

      for (const item of items){
        item.x += item.vx * dt;
        item.y += item.vy * dt;

        if (item.x < -OUT_MARGIN || item.x > W + OUT_MARGIN ||
            item.y < -OUT_MARGIN || item.y > H + OUT_MARGIN){
          respawnOutside(item, W, H);
        }

        item.el.style.transform = `translate(${item.x}px, ${item.y}px)`;
      }

      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  // ===== BYT VATTENSTÄMPEL-BILD HÄR =====
  // Byt ut "watermark.jpg" mot filnamnet/sökvägen till din egen bild
  // (t.ex. "bilder/logga.png"). Samma bild används för alla 6.
  initWatermark('image/blav.png');
</script>

</body>
</html>
